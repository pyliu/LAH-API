<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>凡人修仙傳 - 閱讀器</title>
    <!-- 引入編譯後的 Tailwind CSS -->
    <link rel="stylesheet" href="./assets/style.css?v=7">
    
    <!-- 引入 FontAwesome 圖示庫 (離線版) -->
    <link rel="stylesheet" href="./assets/css/all.min.css">
    
    <!-- 引入 Vue 3 (離線版) -->
    <script src="./assets/js/vue.global.prod.js"></script>

    <style>
        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
        
        body { 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
        }
        
        /* 玻璃擬物化 (Glassmorphism) */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.05);
        }
        .glass-footer {
            background: var(--bg-glass-heavy);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 16px -2px rgba(0, 0, 0, 0.05);
        }
        .glass-sidebar {
            background: var(--bg-glass-heavy);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 24px -2px rgba(0, 0, 0, 0.08);
        }
        
        /* 段落排版 */
        .chapter-content p {
            margin-bottom: 1.2em;
            text-align: justify;
            text-justify: inter-ideograph;
            text-indent: 2em;
        }

        /* 佈景主題變數 (移植自 design.html) */
        :root {
            /* 預設為深色模式 */
            --bg-color: #060911;
            --text-color: #f8fafc;
            --highlight-color: #818cf8;
            --border-color: rgba(255, 255, 255, 0.08);
            --bg-glass: rgba(18, 26, 45, 0.75);
            --bg-glass-heavy: rgba(10, 15, 26, 0.85);
            
            --grad-1: rgba(99, 102, 241, 0.08);
            --grad-2: rgba(2, 132, 199, 0.08);
            --grad-3: rgba(5, 150, 105, 0.05);
        }
        
        body.theme-light {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --highlight-color: #4f46e5;
            --border-color: rgba(0, 0, 0, 0.08);
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-glass-heavy: rgba(255, 255, 255, 0.95);
            
            --grad-1: rgba(99, 102, 241, 0.06);
            --grad-2: rgba(2, 132, 199, 0.06);
            --grad-3: rgba(5, 150, 105, 0.04);
        }
        
        body.theme-sepia {
            --bg-color: #fdf6e3;
            --text-color: #5c4033;
            --highlight-color: #b45309;
            --border-color: rgba(92, 64, 51, 0.12);
            --bg-glass: rgba(253, 246, 227, 0.85);
            --bg-glass-heavy: rgba(253, 246, 227, 0.95);
            
            --grad-1: rgba(217, 119, 6, 0.06);
            --grad-2: rgba(180, 83, 9, 0.04);
            --grad-3: rgba(245, 158, 11, 0.05);
        }
        
        /* 主體背景與顏色過渡 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                radial-gradient(circle at 15% 15%, var(--grad-1) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, var(--grad-2) 0%, transparent 45%),
                radial-gradient(circle at 50% 30%, var(--grad-3) 0%, transparent 50%);
            background-attachment: fixed;
            transition: background-color 0.4s ease, color 0.4s ease, background-image 0.4s ease;
        }
        
        h1, h2, h3, select, input {
            color: var(--highlight-color);
        }
        
        /* 隱藏輸入框的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* 側邊欄目前章節標示 */
        .active-chapter {
            color: var(--highlight-color);
            font-weight: bold;
            background: rgba(0,0,0,0.1);
        }
        /* 轉場動畫 (Fade) */
        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: translateY(10px);
        }
    </style>
</head>
<body class="antialiased">
    <div id="app" class="min-h-screen flex flex-col selection:bg-blue-500 selection:text-white overflow-x-hidden lg:pl-72">
        
        <!-- 狀態提示 -->
        <transition name="fade">
            <div v-if="saveStatus" style="position: fixed; top: 6rem; left: 50%; transform: translateX(-50%); z-index: 100; background-color: rgba(0,0,0,0.8); color: white; padding: 0.75rem 1.5rem; border-radius: 9999px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); font-size: 0.875rem; letter-spacing: 0.025em; backdrop-filter: blur(4px);">
                {{ saveStatus }}
            </div>
        </transition>

        <!-- 密碼輸入視窗 -->
        <transition name="fade">
            <div v-if="showPinModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 150; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 1rem;">
                <div style="background-color: white; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 100%; max-width: 24rem; padding: 1.5rem; text-align: center; color: #1f2937;">
                    <h3 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; margin-top: 0;">請輸入編輯密碼</h3>
                    <p style="font-size: 0.875rem; opacity: 0.7; margin-bottom: 1.5rem; margin-top: 0;">為防止誤觸與惡意修改，請輸入解鎖密碼。</p>
                    <input type="password" v-model="pinInput" @keyup.enter="submitPin" style="width: 100%; box-sizing: border-box; text-align: center; font-size: 1.5rem; letter-spacing: 0.2em; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 0.75rem; background-color: #f9fafb; margin-bottom: 1.5rem; outline: none; color: #1f2937;" placeholder="PIN" autofocus>
                    <div style="display: flex; gap: 0.75rem;">
                        <button @click="cancelPin" style="flex: 1; padding: 0.75rem 0; border-radius: 0.75rem; border: 1px solid #d1d5db; background-color: white; font-weight: 500; cursor: pointer; color: #374151;">取消</button>
                        <button @click="submitPin" style="flex: 1; padding: 0.75rem 0; border-radius: 0.75rem; border: none; background-color: #2563eb; color: white; font-weight: 500; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer;">確認解鎖</button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- 左側側邊欄目錄 (Sidebar) -->
        <div class="fixed inset-0 z-[60] bg-black bg-opacity-50 transition-opacity duration-300 lg:hidden" 
             :class="{'opacity-100': showSidebar, 'opacity-0 pointer-events-none': !showSidebar}"
             @click="toggleSidebar">
        </div>
        
        <aside class="glass-sidebar fixed top-0 left-0 h-full w-72 z-[70] transform transition-transform duration-300 flex flex-col shadow-2xl lg:translate-x-0"
               :class="{'translate-x-0': showSidebar, '-translate-x-full': !showSidebar}">
            <div class="p-4 border-b border-current border-opacity-10 flex items-center justify-between">
                <h2 class="text-xl font-bold tracking-widest">目錄選單</h2>
                <button @click="toggleSidebar" class="p-2 hover:bg-black hover:bg-opacity-10 rounded-full transition lg:hidden">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- 頂部控制區：篇章下拉選單與搜尋框 -->
            <div class="p-4 border-b border-current border-opacity-10 flex flex-col space-y-4">
                <!-- 篇章選擇 -->
                <div class="relative">
                    <select :value="category" @change="onCategoryChange($event.target.value)" class="w-full bg-black bg-opacity-5 border border-current border-opacity-20 rounded-lg pl-4 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-opacity-30 font-bold appearance-none cursor-pointer">
                        <option class="text-gray-900 bg-white" value="人界篇">人界篇</option>
                        <option class="text-gray-900 bg-white" value="靈界篇">靈界篇</option>
                        <option class="text-gray-900 bg-white" value="仙界篇">仙界篇</option>
                        <option class="text-gray-900 bg-white" value="非正式篇章">非正式篇章</option>
                    </select>
                    <i class="fa-solid fa-caret-down absolute right-4 top-1/2 transform -translate-y-1/2 pointer-events-none opacity-50"></i>
                </div>

                <!-- 搜尋框 -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 opacity-50"></i>
                    <input type="text" v-model="searchQuery" placeholder="搜尋章節..." class="w-full bg-black bg-opacity-5 border border-current border-opacity-20 rounded-lg pl-10 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-opacity-30 text-sm">
                    <button v-if="searchQuery" @click="searchQuery = ''" class="absolute right-3 top-1/2 transform -translate-y-1/2 opacity-50 hover:opacity-100">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- 章節列表 -->
            <div class="flex-grow overflow-y-auto p-2" id="sidebar-list">
                <template v-if="catalog[category]">
                    <div v-if="filteredCatalog.length === 0" class="p-4 text-center opacity-50 text-sm">
                        找不到符合的章節
                    </div>
                    <button v-for="item in filteredCatalog" :key="item.id" 
                            @click="selectChapter(item.id)"
                            :id="'sidebar-item-' + item.id"
                            class="w-full text-left px-4 py-3 mb-1 rounded-lg hover:bg-black hover:bg-opacity-5 transition text-sm flex items-center justify-between"
                            :class="{'active-chapter border border-current border-opacity-30 shadow-sm': item.id === chapter, 'opacity-70': item.id !== chapter}">
                        <span class="truncate pr-2">{{ item.title }}</span>
                        <i v-if="item.id === chapter" class="fa-solid fa-book-open text-xs text-blue-500 opacity-80 shrink-0"></i>
                    </button>
                </template>
                <div v-else class="p-4 text-center opacity-50 text-sm">
                    載入目錄中...
                </div>
            </div>
        </aside>

        <!-- 頂部導覽列 -->
        <header class="glass fixed top-0 w-full lg:w-[calc(100%-18rem)] lg:right-0 z-50 transition-transform duration-300 transform lg:translate-y-0" :class="{'translate-y-0': showUI, '-translate-y-full': !showUI}">
            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <!-- 漢堡選單 -->
                    <button @click.stop="toggleSidebar" class="p-2 rounded-md hover:bg-black hover:bg-opacity-10 transition lg:hidden">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-widest hidden sm:block">凡人修仙傳</h1>
                </div>
                <div class="flex space-x-2 sm:space-x-4 items-center">
                    <!-- 編輯模式切換 -->
                    <button @click="handleEditClick" class="w-10 h-10 rounded-full hover:bg-black hover:bg-opacity-10 flex items-center justify-center transition" :class="{'text-blue-500 bg-blue-500 bg-opacity-10': isEditing}" title="切換編輯模式">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <!-- 主題切換 -->
                    <button @click="cycleTheme" class="w-10 h-10 rounded-full hover:bg-black hover:bg-opacity-10 flex items-center justify-center transition" title="切換背景">
                        <i class="fa-solid fa-palette"></i>
                    </button>
                    <!-- 字體大小調整 -->
                    <div class="flex items-center bg-black bg-opacity-5 rounded-full p-1">
                        <button @click="changeFontSize(-2)" class="w-8 h-8 rounded-full hover:bg-black hover:bg-opacity-10 transition text-sm font-bold">A-</button>
                        <span class="px-2 text-sm font-medium opacity-80">{{ fontSize }}</span>
                        <button @click="changeFontSize(2)" class="w-8 h-8 rounded-full hover:bg-black hover:bg-opacity-10 transition text-sm font-bold">A+</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 閱讀內容區 (點擊空白處切換選單) -->
        <main class="flex-grow pt-24 pb-32 px-4 sm:px-8 cursor-pointer" @click="toggleUI">
            <div class="max-w-3xl mx-auto relative min-h-[70vh]">
                
                <transition name="fade" mode="out-in">
                    <!-- 載入中 -->
                    <div v-if="loading" key="loading" class="absolute inset-0 flex flex-col items-center justify-center opacity-70">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4"></i>
                        <span>讀取中...</span>
                    </div>
                    
                    <!-- 錯誤/找不到章節 -->
                    <div v-else-if="error" key="error" class="absolute inset-0 flex flex-col items-center justify-center text-center mt-10">
                        <i class="fa-solid fa-cloud-moon mb-8" style="font-size: 7rem; opacity: 0.4;"></i>
                        <h2 class="mb-6 font-bold tracking-widest" style="font-size: 2.75rem;">本篇已完結</h2>
                        <p class="opacity-70 mb-8 leading-relaxed" style="font-size: 1.25rem;">仙路浩渺，感謝道友一路相伴。<br><span class="opacity-50 mt-4 inline-block" style="font-size: 0.9rem;">({{ error }})</span></p>
                    </div>
                    
                    <!-- 小說內文 -->
                    <div v-else :key="category + '-' + chapter" class="chapter-content transition-all duration-300" :style="{ fontSize: fontSize + 'px', lineHeight: lineHeight }">
                        <!-- 標題 -->
                        <h2 class="font-bold mb-10 mt-6 text-center leading-snug tracking-wide" style="font-size: 1.5em;"
                            :contenteditable="isEditing" 
                            @blur="chapterTitle = $event.target.innerText"
                            :class="{'ring-2 ring-blue-400 ring-opacity-50 p-2 rounded-lg outline-none bg-black bg-opacity-5': isEditing}">
                            {{ chapterTitle }}
                        </h2>
                        
                        <!-- 內容段落 -->
                        <div class="relative">
                            <p v-for="(p, index) in chapterParagraphs" :key="index" 
                               :contenteditable="isEditing" 
                               @blur="chapterParagraphs[index] = $event.target.innerText"
                               :class="{'ring-2 ring-blue-400 ring-opacity-30 p-2 rounded-lg outline-none hover:bg-black hover:bg-opacity-5 transition cursor-text': isEditing}">
                                {{ p }}
                            </p>
                        </div>
                        
                        <!-- 編輯模式的懸浮儲存按鈕 -->
                        <div v-if="isEditing" style="position: fixed; bottom: 6rem; right: 2.5rem; z-index: 100; display: flex; flex-direction: column; gap: 1rem; align-items: center;">
                            <button @click="saveChapter" style="width: 3.5rem; height: 3.5rem; background-color: #2563eb; color: white; border-radius: 9999px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" title="儲存變更">
                                <i class="fa-solid fa-floppy-disk" style="font-size: 1.25rem;"></i>
                            </button>
                            <button @click="isEditing = false; fetchChapter()" style="width: 3rem; height: 3rem; background-color: rgba(75, 85, 99, 0.9); color: white; border-radius: 9999px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" title="取消編輯 (還原)">
                                <i class="fa-solid fa-xmark" style="font-size: 1.125rem;"></i>
                            </button>
                        </div>
                    </div>
                </transition>

            </div>
        </main>

        <!-- 底部導覽列 -->
        <footer class="glass-footer fixed bottom-0 w-full lg:w-[calc(100%-18rem)] lg:right-0 z-50 transition-transform duration-300 transform lg:translate-y-0" :class="{'translate-y-0': showUI, 'translate-y-full': !showUI}">
            <div class="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
                
                <!-- 章節導覽 -->
                <div class="flex items-center justify-center w-full space-x-2">
                    <button @click="prevChapter" :disabled="isFirstChapter" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-current border-opacity-20 hover:bg-black hover:bg-opacity-10 disabled:opacity-20 transition flex items-center justify-center whitespace-nowrap">
                        <i class="fa-solid fa-chevron-left sm:mr-2"></i> <span class="hidden sm:inline">上一章</span>
                    </button>
                    
                    <div class="flex items-center justify-center bg-black bg-opacity-5 border border-current border-opacity-10 rounded-lg px-4 py-2 flex-grow sm:flex-grow-0 cursor-pointer hover:bg-opacity-10 transition lg:pointer-events-none" @click.stop="toggleSidebar">
                        <i class="fa-solid fa-list mr-2 opacity-50"></i>
                        <span class="font-bold opacity-80 truncate max-w-[150px] sm:max-w-[300px]">{{ chapterTitle || '目錄' }}</span>
                    </div>

                    <button @click="nextChapter" :disabled="!!error" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-current border-opacity-20 hover:bg-black hover:bg-opacity-10 disabled:opacity-20 transition flex items-center justify-center whitespace-nowrap">
                        <span class="hidden sm:inline">下一章</span> <i class="fa-solid fa-chevron-right sm:ml-2"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script src="./assets/js/app.js?v=14"></script>
</body>
</html>
