<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>凡人修仙傳 - 閱讀器</title>
    <!-- 引入編譯後的 Tailwind CSS -->
    <link rel="stylesheet" href="./assets/style.css?v=7">

    <!-- 引入 FontAwesome 圖示庫 (離線版) -->
    <link rel="stylesheet" href="./assets/css/all.min.css">

    <!-- 引入 Vue 3 (離線版) -->
    <script src="./assets/js/vue.global.prod.js"></script>

    <style>
        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.8);
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        /* 玻璃擬物化 (Glassmorphism) */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.05);
        }

        .glass-footer {
            background: var(--bg-glass-heavy);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 16px -2px rgba(0, 0, 0, 0.05);
        }

        .glass-sidebar {
            background: var(--bg-glass-heavy);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 24px -2px rgba(0, 0, 0, 0.08);
        }

        /* 段落排版 */
        .chapter-content p {
            margin-bottom: 1.2em;
            text-align: justify;
            text-justify: inter-ideograph;
            text-indent: 2em;
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        /* 佈景主題變數 (版本主題與明暗切換) */
        :root {
            /* 預設: 改編版 + 深色模式 (紫薇仙韻) */
            --bg-color: #080714;
            --text-color: #f1f0fb;
            --highlight-color: #a78bfa;
            --border-color: rgba(167, 139, 250, 0.12);
            --bg-glass: rgba(20, 16, 38, 0.78);
            --bg-glass-heavy: rgba(13, 10, 26, 0.88);
            --active-p-bg: rgba(167, 139, 250, 0.12);
            --grad-1: rgba(139, 92, 246, 0.09);
            --grad-2: rgba(99, 102, 241, 0.08);
            --grad-3: rgba(168, 85, 247, 0.05);
        }

        /* === 1. 改編版 (style-alt: 紫薇仙韻 / 典雅紫藍) === */
        body.style-alt.theme-dark {
            --bg-color: #080714;
            --text-color: #f1f0fb;
            --highlight-color: #a78bfa;
            --border-color: rgba(167, 139, 250, 0.12);
            --bg-glass: rgba(20, 16, 38, 0.78);
            --bg-glass-heavy: rgba(13, 10, 26, 0.88);
            --active-p-bg: rgba(167, 139, 250, 0.12);
            --grad-1: rgba(139, 92, 246, 0.09);
            --grad-2: rgba(99, 102, 241, 0.08);
            --grad-3: rgba(168, 85, 247, 0.05);
        }

        body.style-alt.theme-light {
            --bg-color: #f7f6fd;
            --text-color: #1e1b38;
            --highlight-color: #7c3aed;
            --border-color: rgba(124, 58, 237, 0.1);
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-glass-heavy: rgba(247, 246, 253, 0.96);
            --active-p-bg: rgba(124, 58, 237, 0.07);
            --grad-1: rgba(139, 92, 246, 0.05);
            --grad-2: rgba(99, 102, 241, 0.04);
            --grad-3: rgba(168, 85, 247, 0.03);
        }

        body.style-alt.theme-sepia {
            --bg-color: #fbf6f0;
            --text-color: #4a3b4c;
            --highlight-color: #9333ea;
            --border-color: rgba(147, 51, 234, 0.12);
            --bg-glass: rgba(251, 246, 240, 0.88);
            --bg-glass-heavy: rgba(247, 240, 232, 0.96);
            --active-p-bg: rgba(147, 51, 234, 0.08);
            --grad-1: rgba(168, 85, 247, 0.05);
            --grad-2: rgba(217, 119, 6, 0.04);
            --grad-3: rgba(139, 92, 246, 0.03);
        }

        /* === 2. 台灣版 (style-tw: 竹林翠嵐 / 翡翠竹青) === */
        body.style-tw.theme-dark {
            --bg-color: #06100c;
            --text-color: #f0fdf4;
            --highlight-color: #34d399;
            --border-color: rgba(52, 211, 153, 0.12);
            --bg-glass: rgba(12, 30, 24, 0.78);
            --bg-glass-heavy: rgba(8, 20, 16, 0.88);
            --active-p-bg: rgba(52, 211, 153, 0.12);
            --grad-1: rgba(16, 185, 129, 0.09);
            --grad-2: rgba(13, 148, 136, 0.08);
            --grad-3: rgba(5, 150, 105, 0.05);
        }

        body.style-tw.theme-light {
            --bg-color: #f4fbf7;
            --text-color: #0f291e;
            --highlight-color: #059669;
            --border-color: rgba(5, 150, 105, 0.1);
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-glass-heavy: rgba(244, 251, 247, 0.96);
            --active-p-bg: rgba(5, 150, 105, 0.07);
            --grad-1: rgba(16, 185, 129, 0.05);
            --grad-2: rgba(14, 165, 233, 0.04);
            --grad-3: rgba(5, 150, 105, 0.03);
        }

        body.style-tw.theme-sepia {
            --bg-color: #f7f7ee;
            --text-color: #3a4738;
            --highlight-color: #15803d;
            --border-color: rgba(21, 128, 61, 0.12);
            --bg-glass: rgba(247, 247, 238, 0.88);
            --bg-glass-heavy: rgba(241, 241, 228, 0.96);
            --active-p-bg: rgba(21, 128, 61, 0.08);
            --grad-1: rgba(34, 197, 94, 0.05);
            --grad-2: rgba(202, 138, 4, 0.04);
            --grad-3: rgba(16, 185, 129, 0.03);
        }

        /* === 3. 大陸版 (style-cn: 朱砂丹霞 / 暖褐赤石) === */
        body.style-cn.theme-dark {
            --bg-color: #120908;
            --text-color: #fff1f0;
            --highlight-color: #f87171;
            --border-color: rgba(248, 113, 113, 0.12);
            --bg-glass: rgba(34, 18, 18, 0.78);
            --bg-glass-heavy: rgba(24, 12, 12, 0.88);
            --active-p-bg: rgba(248, 113, 113, 0.12);
            --grad-1: rgba(239, 68, 68, 0.08);
            --grad-2: rgba(217, 119, 6, 0.08);
            --grad-3: rgba(185, 28, 28, 0.05);
        }

        body.style-cn.theme-light {
            --bg-color: #fff8f7;
            --text-color: #331412;
            --highlight-color: #dc2626;
            --border-color: rgba(220, 38, 38, 0.1);
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-glass-heavy: rgba(255, 248, 247, 0.96);
            --active-p-bg: rgba(220, 38, 38, 0.07);
            --grad-1: rgba(239, 68, 68, 0.05);
            --grad-2: rgba(245, 158, 11, 0.04);
            --grad-3: rgba(239, 68, 68, 0.03);
        }

        body.style-cn.theme-sepia {
            --bg-color: #fcf5eb;
            --text-color: #52372d;
            --highlight-color: #b91c1c;
            --border-color: rgba(185, 28, 28, 0.12);
            --bg-glass: rgba(252, 245, 235, 0.88);
            --bg-glass-heavy: rgba(248, 237, 222, 0.96);
            --active-p-bg: rgba(185, 28, 28, 0.08);
            --grad-1: rgba(220, 38, 38, 0.05);
            --grad-2: rgba(217, 119, 6, 0.05);
            --grad-3: rgba(180, 83, 9, 0.03);
        }

        /* 主體背景與顏色過渡 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image:
                radial-gradient(circle at 15% 15%, var(--grad-1) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, var(--grad-2) 0%, transparent 45%),
                radial-gradient(circle at 50% 30%, var(--grad-3) 0%, transparent 50%);
            background-attachment: fixed;
            transition: background-color 0.4s ease, color 0.4s ease, background-image 0.4s ease;
        }

        h1,
        h2,
        h3,
        select,
        input {
            color: var(--highlight-color);
        }

        /* 隱藏輸入框的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 側邊欄目前章節標示 */
        .active-chapter {
            color: var(--highlight-color);
            font-weight: bold;
            background: rgba(0, 0, 0, 0.1);
        }

        /* 轉場動畫 (Fade) */
        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: translateY(10px);
        }

        /* 記憶位置的高亮動畫 */
        @keyframes memory-flash {

            0%,
            100% {
                background-color: transparent;
                color: inherit;
                box-shadow: none;
            }

            15%,
            75% {
                background-color: var(--highlight-color);
                color: var(--bg-color);
                box-shadow: 0 0 12px var(--highlight-color);
            }
        }

        .memory-highlight {
            animation: memory-flash 3s ease-in-out;
            border-radius: 0.25rem;
        }

        /* 點選段落保留高亮 (Persistent Paragraph Highlight) */
        .active-paragraph {
            background-color: var(--active-p-bg);
            border-left: 3px solid var(--highlight-color);
            padding: 0.35rem 0.5rem;
            border-radius: 0.25rem;
            box-shadow: 0 0 10px var(--active-p-bg);
        }
    </style>
</head>

<body class="antialiased">
    <div id="app"
        class="min-h-screen flex flex-col selection:bg-blue-500 selection:text-white overflow-x-hidden lg:pl-72">

        <!-- 狀態提示 -->
        <transition name="fade">
            <div v-if="saveStatus"
                style="position: fixed; top: 6rem; left: 50%; transform: translateX(-50%); z-index: 100; background-color: rgba(0,0,0,0.8); color: white; padding: 0.75rem 1.5rem; border-radius: 9999px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); font-size: 0.875rem; letter-spacing: 0.025em; backdrop-filter: blur(4px);">
                {{ saveStatus }}
            </div>
        </transition>

        <!-- 密碼輸入視窗 -->
        <transition name="fade">
            <div v-if="showPinModal"
                style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 150; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 1rem;">
                <div
                    style="background-color: white; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 100%; max-width: 24rem; padding: 1.5rem; text-align: center; color: #1f2937;">
                    <h3 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; margin-top: 0;">請輸入編輯密碼
                    </h3>
                    <p style="font-size: 0.875rem; opacity: 0.7; margin-bottom: 1.5rem; margin-top: 0;">
                        為防止誤觸與惡意修改，請輸入解鎖密碼。</p>
                    <input type="password" v-model="pinInput" @keyup.enter="submitPin"
                        style="width: 100%; box-sizing: border-box; text-align: center; font-size: 1.5rem; letter-spacing: 0.2em; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 0.75rem; background-color: #f9fafb; margin-bottom: 1.5rem; outline: none; color: #1f2937;"
                        placeholder="PIN" autofocus>
                    <div style="display: flex; gap: 0.75rem;">
                        <button @click="cancelPin"
                            style="flex: 1; padding: 0.75rem 0; border-radius: 0.75rem; border: 1px solid #d1d5db; background-color: white; font-weight: 500; cursor: pointer; color: #374151;">取消</button>
                        <button @click="submitPin"
                            style="flex: 1; padding: 0.75rem 0; border-radius: 0.75rem; border: none; background-color: #2563eb; color: white; font-weight: 500; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer;">確認解鎖</button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- 左側側邊欄目錄 (Sidebar) -->
        <div class="fixed inset-0 z-[60] bg-black bg-opacity-50 transition-opacity duration-300 lg:hidden"
            :class="{'opacity-100': showSidebar, 'opacity-0 pointer-events-none': !showSidebar}" @click="toggleSidebar">
        </div>

        <aside
            class="glass-sidebar fixed top-0 left-0 h-full w-72 z-[70] transform transition-transform duration-300 flex flex-col shadow-2xl lg:translate-x-0"
            :class="{'translate-x-0': showSidebar, '-translate-x-full': !showSidebar}">
            <div class="p-4 border-b border-current border-opacity-10 flex items-center justify-between">
                <h2 class="text-xl font-bold tracking-widest">目錄選單</h2>
                <button @click="toggleSidebar"
                    class="p-2 hover:bg-black hover:bg-opacity-10 rounded-full transition lg:hidden">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 頂部控制區：篇章下拉選單與搜尋框 -->
            <div class="p-4 border-b border-current border-opacity-10 flex flex-col space-y-4">
                <!-- 篇章選擇 -->
                <div class="relative">
                    <select :value="category" @change="onCategoryChange($event.target.value)"
                        class="w-full bg-black bg-opacity-5 border border-current border-opacity-20 rounded-lg pl-4 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-opacity-30 font-bold appearance-none cursor-pointer">
                        <option class="text-gray-900 bg-white" value="人界篇">人界篇</option>
                        <option class="text-gray-900 bg-white" value="靈界篇">靈界篇</option>
                        <option class="text-gray-900 bg-white" value="仙界篇">仙界篇</option>
                        <option class="text-gray-900 bg-white" value="非正式篇章">非正式篇章</option>
                    </select>
                    <i
                        class="fa-solid fa-caret-down absolute right-4 top-1/2 transform -translate-y-1/2 pointer-events-none opacity-50"></i>
                </div>

                <!-- 搜尋框 -->
                <div class="relative">
                    <i
                        class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 opacity-50"></i>
                    <input type="text" v-model="searchQuery" placeholder="搜尋章節..."
                        class="w-full bg-black bg-opacity-5 border border-current border-opacity-20 rounded-lg pl-10 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-opacity-30 text-sm">
                    <button v-if="searchQuery" @click="searchQuery = ''"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 opacity-50 hover:opacity-100">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- 章節列表 -->
            <div class="flex-grow overflow-y-auto p-2" id="sidebar-list">
                <template v-if="catalog[category]">
                    <div v-if="filteredCatalog.length === 0" class="p-4 text-center opacity-50 text-sm">
                        找不到符合的章節
                    </div>
                    <button v-for="item in filteredCatalog" :key="item.id" @click="selectChapter(item.id)"
                        :id="'sidebar-item-' + item.id"
                        class="w-full text-left px-4 py-3 mb-1 rounded-lg hover:bg-black hover:bg-opacity-5 transition text-sm flex items-center justify-between"
                        :class="{'active-chapter border border-current border-opacity-30 shadow-sm': item.id === chapter, 'opacity-70': item.id !== chapter}">
                        <span class="truncate pr-2">{{ item.title }}</span>
                        <i v-if="item.id === chapter"
                            class="fa-solid fa-book-open text-xs opacity-90 shrink-0"
                            style="color: var(--highlight-color);"></i>
                    </button>
                </template>
                <div v-else class="p-4 text-center opacity-50 text-sm">
                    載入目錄中...
                </div>
            </div>
        </aside>

        <!-- 頂部導覽列 -->
        <header
            class="glass fixed top-0 w-full lg:w-[calc(100%-18rem)] lg:right-0 z-50 transition-transform duration-300 transform lg:translate-y-0"
            :class="{'translate-y-0': showUI, '-translate-y-full': !showUI}">
            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <!-- 漢堡選單 -->
                    <button @click.stop="toggleSidebar"
                        class="p-2 rounded-md hover:bg-black hover:bg-opacity-10 transition lg:hidden">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-widest hidden sm:block">凡人修仙傳</h1>
                </div>
                <div class="flex space-x-2 sm:space-x-4 items-center">
                    <!-- 編輯模式切換 -->
                    <button @click="handleEditClick"
                        class="w-10 h-10 rounded-full hover:bg-black hover:bg-opacity-10 flex items-center justify-center transition"
                        :class="{'text-blue-500 bg-blue-500 bg-opacity-10': isEditing}" title="切換編輯模式">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <!-- 大陸/台灣風格切換 -->
                    <button @click.stop="toggleTextStyle" class="flex items-center rounded-full p-1 transition"
                        style="background: rgba(0,0,0,0.05);"
                        :title="displayTextStyle === 'cn' ? '目前：大陸版，點擊切換為台灣版' : (displayTextStyle === 'tw' ? '目前：台灣標準版，點擊切換為' + (hasAltVersion ? '精修改寫版' : '大陸版') : '目前：精修改寫版，點擊切換為大陸版')"
                        id="btn-text-style">
                        <span
                            class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-200"
                            :style="displayTextStyle === 'cn'
                                ? 'background:#ef4444;color:#fff;box-shadow:0 2px 6px rgba(239,68,68,.5);'
                                : 'background:rgba(0,0,0,0.08);color:inherit;'">陸</span>
                        <span
                            class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-200"
                            :style="displayTextStyle === 'tw'
                                ? 'background:#16a34a;color:#fff;box-shadow:0 2px 6px rgba(22,163,74,.5);'
                                : 'background:rgba(0,0,0,0.08);color:inherit;'">台</span>
                        <span v-if="hasAltVersion"
                            class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-200"
                            :style="displayTextStyle === 'alt'
                                ? 'background:#8b5cf6;color:#fff;box-shadow:0 2px 6px rgba(139,92,246,.5);'
                                : 'background:rgba(0,0,0,0.08);color:inherit;'" title="精修生動改寫版">改</span>
                    </button>
                    <!-- 主題切換 (深色 / 淺色 / 羊皮紙) -->
                    <button @click="cycleTheme"
                        class="w-10 h-10 rounded-full hover:bg-black hover:bg-opacity-10 flex items-center justify-center transition"
                        :title="themeIndex === 0 ? '目前：深色模式，點擊切換為淺色模式' : (themeIndex === 1 ? '目前：淺色模式，點擊切換為羊皮紙模式' : '目前：羊皮紙模式，點擊切換為深色模式')">
                        <i class="fa-solid fa-palette"></i>
                    </button>
                    <!-- 字體大小調整 -->
                    <div class="flex items-center bg-black bg-opacity-5 rounded-full p-1">
                        <button @click="changeFontSize(-2)"
                            class="w-8 h-8 rounded-full hover:bg-black hover:bg-opacity-10 transition text-sm font-bold">A-</button>
                        <span class="px-2 text-sm font-medium opacity-80">{{ fontSize }}</span>
                        <button @click="changeFontSize(2)"
                            class="w-8 h-8 rounded-full hover:bg-black hover:bg-opacity-10 transition text-sm font-bold">A+</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 閱讀內容區 (點擊空白處切換選單) -->
        <main class="flex-grow pt-24 pb-32 px-4 sm:px-8 cursor-pointer" @click="toggleUI">
            <div class="max-w-4xl mx-auto relative min-h-[70vh]">

                <transition name="fade" mode="out-in">
                    <!-- 載入中 -->
                    <div v-if="loading" key="loading"
                        class="absolute inset-0 flex flex-col items-center justify-center opacity-70">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4"></i>
                        <span>讀取中...</span>
                    </div>

                    <!-- 錯誤/找不到章節 -->
                    <div v-else-if="error" key="error"
                        class="absolute inset-0 flex flex-col items-center justify-center text-center mt-10">
                        <i class="fa-solid fa-cloud-moon mb-8" style="font-size: 7rem; opacity: 0.4;"></i>
                        <h2 class="mb-6 font-bold tracking-widest" style="font-size: 2.75rem;">本篇已完結</h2>
                        <p class="opacity-70 mb-8 leading-relaxed" style="font-size: 1.25rem;">仙路浩渺，感謝道友一路相伴。<br><span
                                class="opacity-50 mt-4 inline-block" style="font-size: 0.9rem;">({{ error }})</span></p>
                    </div>

                    <!-- 小說內文 -->
                    <div v-else :key="category + '-' + chapter" class="chapter-content transition-all duration-300"
                        :style="{ fontSize: fontSize + 'px', lineHeight: lineHeight }">
                        <!-- 標題 -->
                        <h2 class="font-bold mb-2 mt-6 text-center leading-snug tracking-wide" style="font-size: 1.5em;"
                            :contenteditable="isEditing" @blur="chapterTitle = $event.target.innerText"
                            :class="{'ring-2 ring-blue-400 ring-opacity-50 p-2 rounded-lg outline-none bg-black bg-opacity-5': isEditing}">
                            {{ chapterTitle }}
                        </h2>
                        <div v-if="chapterWordCount > 0"
                            class="text-center opacity-40 text-sm mb-8 font-mono tracking-wider flex items-center justify-center">
                            <i class="fa-solid fa-feather mr-2"></i> 共 {{ chapterWordCount }} 字
                        </div>

                        <!-- 內容段落 -->
                        <div class="relative">
                            <p v-for="(p, index) in chapterParagraphs" :key="index" :contenteditable="isEditing"
                                @blur="chapterParagraphs[index] = $event.target.innerText"
                                @click.stop="setMemoryPoint(index)" :class="[
                                   {'ring-2 ring-blue-400 ring-opacity-30 p-2 rounded-lg outline-none hover:bg-black hover:bg-opacity-5 transition cursor-text': isEditing},
                                   {'active-paragraph': index === activeParagraphIndex && !isEditing},
                                   {'memory-highlight': index === highlightedParagraphIndex}
                               ]">
                                {{ p }}
                            </p>
                        </div>

                        <!-- 編輯模式的懸浮儲存按鈕 -->
                        <div v-if="isEditing"
                            style="position: fixed; bottom: 6rem; right: 2.5rem; z-index: 100; display: flex; flex-direction: column; gap: 1rem; align-items: center;">
                            <button @click="saveChapter"
                                style="width: 3.5rem; height: 3.5rem; background-color: #2563eb; color: white; border-radius: 9999px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;"
                                onmouseover="this.style.transform='scale(1.05)'"
                                onmouseout="this.style.transform='scale(1)'" title="儲存變更">
                                <i class="fa-solid fa-floppy-disk" style="font-size: 1.25rem;"></i>
                            </button>
                            <button @click="cancelEdit"
                                style="width: 3rem; height: 3rem; background-color: rgba(75, 85, 99, 0.9); color: white; border-radius: 9999px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;"
                                onmouseover="this.style.transform='scale(1.05)'"
                                onmouseout="this.style.transform='scale(1)'" title="取消編輯 (還原)">
                                <i class="fa-solid fa-xmark" style="font-size: 1.125rem;"></i>
                            </button>
                        </div>
                    </div>
                </transition>

            </div>
        </main>

        <!-- 底部導覽列 -->
        <footer
            class="glass-footer fixed bottom-0 w-full lg:w-[calc(100%-18rem)] lg:right-0 z-50 transition-transform duration-300 transform lg:translate-y-0"
            :class="{'translate-y-0': showUI, 'translate-y-full': !showUI}">
            <div
                class="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">

                <!-- 章節導覽 -->
                <div class="flex items-center justify-center w-full space-x-2">
                    <button @click="prevChapter" :disabled="isFirstChapter"
                        class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-current border-opacity-20 hover:bg-black hover:bg-opacity-10 disabled:opacity-20 transition flex items-center justify-center whitespace-nowrap">
                        <i class="fa-solid fa-chevron-left sm:mr-2"></i> <span class="hidden sm:inline">上一章</span>
                    </button>

                    <div class="flex items-center justify-center bg-black bg-opacity-5 border border-current border-opacity-10 rounded-lg px-4 py-2 flex-grow sm:flex-grow-0 cursor-pointer hover:bg-opacity-10 transition lg:pointer-events-none"
                        @click.stop="toggleSidebar">
                        <i class="fa-solid fa-list mr-2 opacity-50"></i>
                        <span class="font-bold opacity-80 truncate max-w-[150px] sm:max-w-[300px]">{{ chapterTitle ||
                            '目錄' }}</span>
                    </div>

                    <button @click="nextChapter" :disabled="!!error"
                        class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-current border-opacity-20 hover:bg-black hover:bg-opacity-10 disabled:opacity-20 transition flex items-center justify-center whitespace-nowrap">
                        <span class="hidden sm:inline">下一章</span> <i class="fa-solid fa-chevron-right sm:ml-2"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script src="./assets/js/app.js?v=20"></script>
</body>

</html>
